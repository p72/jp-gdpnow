name: nowcast

# 平日 17:07 と 21:43 JST に実行（GitHub の定時実行は混雑で数時間遅れることがあるため、
# 混みやすい 00分・30分を避け、予備を1本足している）。前回から新しい（または改定された）
# データがあるときだけ予想を記録し、data/ と output/ をコミットする。2回目は通常スキップ。
# 手動実行は Actions タブの "Run workflow"。
on:
  schedule:
    - cron: "7 8 * * 1-5"    # 08:07 UTC = 17:07 JST（日銀 16時発表の後）
    - cron: "43 12 * * 1-5"  # 12:43 UTC = 21:43 JST（予備）
  workflow_dispatch:
    inputs:
      force:
        description: "新しいデータが無くても実行して記録する"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nowcast
  cancel-in-progress: false

jobs:
  nowcast:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Tokyo
      JP_GDPNOW_HOME: ${{ github.workspace }}/data
      ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージ
        run: pip install -r requirements.txt

      - name: ナウキャスト
        run: |
          FLAG="--only-if-new"
          if [ "${{ inputs.force }}" = "true" ]; then FLAG=""; fi
          python -m scripts.cli nowcast $FLAG --out output 2>&1 | tee output/last_run.log

      - name: 結果をコミット
        run: |
          git config user.name "jp-gdpnow bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data output
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "nowcast $(date +%F) (自動実行)"
            git push
          fi
