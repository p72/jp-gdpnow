name: nowcast

# 平日 12:07 と 16:43 JST に設定。このリポジトリの定時実行は実測で約5時間遅れて動く
# （2026-10-21〜23 の4回で 4時間43分〜5時間13分）ため、遅れを見込んで前倒ししている。
#   遅れが続く場合   : 実際は 17時ごろ・21時40分ごろ（日銀 16時発表の後、日付をまたがない）
#   遅れが解消した場合: 12:07（経産省 8:50 発表を拾う）・16:43（日銀 16時発表を拾う）
# 前回から新しい（または改定された）データがあるときだけ予想を記録し、data/ と output/ を
# コミットする。手動実行は Actions タブの "Run workflow"。
on:
  schedule:
    - cron: "7 3 * * 1-5"    # 03:07 UTC = 12:07 JST
    - cron: "43 7 * * 1-5"   # 07:43 UTC = 16:43 JST
  workflow_dispatch:
    inputs:
      force:
        description: "新しいデータが無くても実行して記録する"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nowcast
  cancel-in-progress: false

jobs:
  nowcast:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Tokyo
      JP_GDPNOW_HOME: ${{ github.workspace }}/data
      ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージ
        run: pip install -r requirements.txt

      - name: ナウキャスト
        run: |
          FLAG="--only-if-new"
          if [ "${{ inputs.force }}" = "true" ]; then FLAG=""; fi
          python -m scripts.cli nowcast $FLAG --out output 2>&1 | tee output/last_run.log

      - name: 結果をコミット
        run: |
          git config user.name "jp-gdpnow bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data output
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "nowcast $(date +%F) (自動実行)"
            git push
          fi
